name: Bug report
description: Something does not work as described in the documentation.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Never paste your Consumer Key or Consumer Secret.
  - type: input
    id: gladys-version
    attributes:
      label: Gladys version
      description: Settings → System.
      placeholder: '5.3.0'
    validations:
      required: true
  - type: input
    id: integration-version
    attributes:
      label: Integration version
      description: Integrations → Danfoss Ally, or Settings → Supervision.
      placeholder: '0.1.0'
    validations:
      required: true
  - type: input
    id: devices
    attributes:
      label: Danfoss devices
      description: The models concerned (Danfoss Ally radiator thermostat, room sensor, Icon / Icon2 room thermostat…).
      placeholder: 'Danfoss Ally Radiator Thermostat, Icon2 RT'
  - type: textarea
    id: test-connection
    attributes:
      label: Result of "Test the connection"
      description: The text shown under the "Test the connection" button of the configuration (devices, models, features). Rename your rooms if you wish.
      render: text
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what you expected
      description: Remember that a change made in Gladys reaches the device, and a change made in the Ally app reaches Gladys, through the Danfoss cloud within a few minutes.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Logs of the integration (Settings → Supervision). In developer mode, add the environment variable `DEBUG=gladys-integration-sdk` for the SDK debug logs, reproduce, then copy the lines. The logs never contain the Consumer Secret nor the access token.
      render: text
